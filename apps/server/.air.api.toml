# Hot reload for the API (`bun run dev:hybrid` starts this from apps/server).
# Polling is switched on by AIR_POLL=1, see scripts/lib/air.ts.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  bin = "./tmp/api.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "tools", "db"]
  exclude_regex = ['_test\.go$']
  delay = 500
  # Lets the server drain in-flight requests; Windows has no interrupt, so air just kills it.
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = false

[misc]
  clean_on_exit = true
